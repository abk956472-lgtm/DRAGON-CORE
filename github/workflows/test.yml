
name: DRAGON CORE TEST

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python files
        run: python -m compileall -q .

      - name: Test imports
        run: python -c "import main, network, tunnel, dragon_core"

      - name: Success
        run: echo "DRAGON CORE TEST PASSED"
